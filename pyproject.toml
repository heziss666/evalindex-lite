[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evalindex-lite"
version = "0.1.0"
description = "Small multi-benchmark evaluation pipeline - initial runnable scaffold"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
benchmarks = [
  "datasets==5.2.0",
  "math-verify[antlr4_13_2]==0.9.0",
  "absl-py==2.3.1",
  "immutabledict==4.2.1",
  "langdetect==1.0.9",
  "nltk==3.9.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"evalindex._vendor.ifeval" = ["LICENSE", "input_data.jsonl"]
